[workspace]
resolver = "2"
members = [
    "crates/logbook-model",
    "crates/logbook-store",
    "crates/logbook-store-write",
    "crates/logbook-readers",
    "crates/logbook-exec",
    "crates/logbook-derive",
    "crates/logbook-redact",
    "crates/logbook-render",
    "crates/logbook-query",
    "crates/logbook-guard",
    "crates/logbook-undo",
    "crates/logbook-collector",
    "crates/logbook-cli",
    "crates/logbook-mcp",
    "crates/logbook-gtk",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.92"

# Logbook's own crates. Which crate may depend on which is enforced by
# scripts/arch-check.py (function map, "Crates: who may do what").
# External dependencies: none yet. Every new one needs the owner's approval
# (build plan, V13).
[workspace.dependencies]
# Each Logbook crate is added here when the first crate uses it.
logbook-guard = { path = "crates/logbook-guard" }
logbook-model = { path = "crates/logbook-model" }
logbook-store = { path = "crates/logbook-store" }
logbook-store-write = { path = "crates/logbook-store-write" }

# Outside crates: each one approved by the owner (gate, Cargo.lock).
# default-features = false where defaults pull in more than Logbook uses.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false }
# SQLite, compiled into Logbook (bundled), so every distribution runs the same version.
rusqlite = { version = "0.43.0", features = ["bundled"] }
# System calls without unsafe code: opening without following links, file modes.
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }
# The kernel's guards without unsafe code in Logbook: the seccomp network
# filter (F-L02) and Landlock file limits (F-L03).
seccompiler = { version = "0.5.0", default-features = false }
landlock = { version = "0.4.8", default-features = false }
# Files inherited open, marked close-on-exec before a program starts (F-L03).
close_fds = { version = "0.3.2", default-features = false }
# Tests only.
# io_uring, to show that the network block refuses it (it could open sockets
# without the socket call).
io-uring = { version = "0.7.16", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
regex = { version = "1.13.2", default-features = false, features = ["std", "unicode"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Lints for every crate (each has `[lints] workspace = true`; the
# architecture check fails if one does not).
[workspace.lints.rust]
# No unsafe code in Logbook's own crates. "forbid" cannot be switched off
# further down with #[allow] (build plan, V12).
unsafe_code = "forbid"

[workspace.lints.clippy]
# No .unwrap() and no deliberate crashes outside tests: a failure is an
# error the caller handles (clippy.toml allows both in tests).
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Programs are started only by logbook-exec, and no Logbook code opens a
# network connection (clippy.toml lists the forbidden calls and types).
disallowed_methods = "deny"
disallowed_types = "deny"
