# cargo-deny: checks every Rust dependency (`cargo deny check`).
#   advisories  known security problems (RustSec), unmaintained crates
#   licenses    only licences that can be combined with GPL-3.0-or-later
#   bans        crates Logbook must not pull in (network, backtracking regex)
#   sources     crates come only from crates.io
# Changing this file needs the owner's approval (build plan, section 3).

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false

[advisories]
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # No network (F-L02): HTTP clients and servers, TLS.
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "hyper-util" },
    { crate = "h2" },
    { crate = "ureq" },
    { crate = "curl" },
    { crate = "isahc" },
    { crate = "attohttpc" },
    { crate = "surf" },
    { crate = "axum" },
    { crate = "actix-web" },
    { crate = "warp" },
    { crate = "tiny_http" },
    { crate = "rustls" },
    { crate = "native-tls" },
    { crate = "openssl" },
    # Only regular expressions with guaranteed linear running time (F-C02,
    # F-L03): no backtracking engines.
    { crate = "fancy-regex" },
    { crate = "pcre2" },
    { crate = "onig" },
]
# Network features of otherwise allowed crates. VERIFY the exact syntax
# against the cargo-deny version used in CI before the first dependency
# arrives (build plan, step P1).
features = [
    { crate = "tokio", deny = ["net"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
