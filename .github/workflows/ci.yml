# Logbook CI. Phase 0: the static checks, and on pull requests "No test
# lost" (gate item 4). Every action is pinned by its full commit hash.
# The rule on main (step P5) requires this job and "Needs your approval".
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    # The cheat list runs the whole test suite once per cheat: about 25
    # minutes since step 3, more than 30 on a slow runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Architecture check
        run: python3 scripts/arch-check.py
      - name: Architecture check catches every deliberate break
        run: sh scripts/arch-check-selftest.sh
      - name: Dependencies (cargo-deny)
        run: |
          cargo install --locked cargo-deny
          cargo deny check
      - name: Tests, and every due claim proven by a test that ran and passed
        run: python3 scripts/claims-check.py
      - name: Map check catches every deliberate flaw
        run: sh scripts/claims-check-selftest.sh
      - name: Break list - every deliberate mistake is caught
        run: python3 scripts/breaks-check.py
      - name: Break list tells caught, uncaught, stale and wrong breaks apart
        run: sh scripts/breaks-check-selftest.sh
      - name: Mutation check tells survivors, thresholds and stale entries apart
        run: sh scripts/mutants-check-selftest.sh
      - name: Fresh days - same seed same day, every broken reader noticed
        run: python3 scripts/freshday.py selftest
      - name: Cheat list - the gate flags every known way to weaken the checks
        run: python3 scripts/cheats-check.py
      - name: No test lost - every test that passed on main still runs and passes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: sh scripts/tests-lost.sh "origin/$BASE_REF"
# Items 1-3 of the gate ("Needs your approval") run in approval.yml, as
# main's copy (pull_request_target); locally: make gate BASE=<commit>.
