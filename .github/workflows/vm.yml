# Test computers (build plan V08, step P6) and fresh days (V04, step P7):
# throwaway virtual machines on GitHub's runners, never on the owner's
# computer. The watchers prove themselves with their probes; then a fresh day,
# decided by a seed picked at run time, is acted out, recorded and compared.
# A failed day is replayed by running this workflow by hand with its seed.
name: Test computers

on:
  pull_request:
    paths:
      - "vm/**"
      - "scripts/vm.py"
      - ".github/workflows/vm.yml"
  push:
    branches: [main]
    paths:
      - "vm/**"
      - "scripts/vm.py"
      - ".github/workflows/vm.yml"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed of the day to replay (empty: a new random day)"
        required: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: QEMU and KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 qemu-utils dosfstools mtools
      - name: The official image, by its pinned fingerprint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/vm/*.qcow2
          key: vm-image-${{ hashFiles('vm/images.toml') }}
      - name: Prepare the test computer
        run: python3 scripts/vm.py prepare arch
      - name: Watchers prove themselves - every probe caught, the quiet one not
        run: python3 scripts/vm.py selftest arch
      - name: Pick the day
        id: day
        env:
          SEED_IN: ${{ inputs.seed }}
        run: |
          seed=${SEED_IN:-$(python3 -c 'import secrets; print(secrets.randbelow(2**31))')}
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Fresh day seed: **$seed** (replay: run this workflow by hand with this seed)" >> "$GITHUB_STEP_SUMMARY"
      - name: A fresh day - acted out, recorded, the reader compared with the harness
        env:
          SEED: ${{ steps.day.outputs.seed }}
        run: python3 scripts/vm.py day arch "$SEED" target/vm/day
      - name: Keep the console and the recorded day
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-computer-arch
          path: |
            target/vm/last-console.log
            target/vm/day/
          if-no-files-found: ignore
          retention-days: 14
