# Tests may unwrap and panic: a panic there is a failed test.
allow-unwrap-in-tests = true
allow-panic-in-tests = true

# Starting programs is allowed only in logbook-exec (F-L03). That crate is the
# only one allowed to say #[allow(clippy::disallowed_methods)]; the
# architecture check enforces this.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "programs are started only by logbook-exec, from its fixed list (F-L03)" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "programs are started only by logbook-exec (F-L03)" },
]

# No network in any Logbook code (F-L02). The kernel-level block in
# logbook-guard is the real guarantee; this is a second layer.
disallowed-types = [
    { path = "std::net::TcpStream", reason = "Logbook has no network (F-L02)" },
    { path = "std::net::TcpListener", reason = "Logbook has no network (F-L02)" },
    { path = "std::net::UdpSocket", reason = "Logbook has no network (F-L02)" },
]
