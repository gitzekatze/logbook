[package]
name = "logbook-guard"
description = "Network block and file-access limits that every Logbook program applies to itself first (F-L02, F-L03)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
seccompiler.workspace = true
landlock.workspace = true

[dev-dependencies]
rustix = { workspace = true, features = ["net"] }
io-uring.workspace = true

[lints]
workspace = true

# The network block and the file limit apply to the whole process and can't
# be lifted, so each spec runs in a test binary of its own.
[[test]]
name = "network"
path = "tests/network.rs"

[[test]]
name = "files"
path = "tests/files.rs"
