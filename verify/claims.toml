# ---- claims

[[claim]]
id = "G1"
function = "global"
due = "0.1a"
security = false
proofs = ["CONF"]
text = "Determinism: the same input twice gives byte-identical events."

[[claim]]
id = "G2"
function = "global"
due = "0.1a"
security = false
proofs = ["CONF", "PROP"]
text = "Split and resume: the input cut at random points with a restart in between gives the same result as an uninterrupted run."

[[claim]]
id = "G3"
function = "global"
due = "0.1a"
security = false
proofs = ["CONF"]
text = "Stable IDs: deriving again changes no event ID."

[[claim]]
id = "G4"
function = "global"
due = "0.3"
security = true
proofs = ["CONF", "CANARY"]
